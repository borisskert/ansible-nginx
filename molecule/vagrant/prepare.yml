---
- name: Prepare
  hosts: all
  become: true

  roles:
    - role: install-docker
      docker_storage_driver: overlay2
      docker_cleanup_enabled: false
      docker_install_pip_package: true

    - role: create-self-signed-certs
      openssl_ca_name: "{{ nginx_ca_name }}"
      openssl_working_directory: /srv/openssl
      openssl_certificates_directory: /srv/nginx/certs/live
      openssl_sites:
        - my.https.server

  post_tasks:
    - name: Perform prepare
      include_tasks: ../shared/prepare.yml

    - name: Pull apache's docker image
      docker_image:
        name: httpd:2.4.43
        source: pull

    - name: Start another webserver via docker (to test reverse-proxy)
      docker_container:
        name: my_another_webserver
        image: httpd:2.4.43
        state: started
        ports:
          - "10080:80"

    - name: Install netcat on Debian-based systems (to test open ports)
      package:
          name: netcat-traditional
          state: present
      when: ansible_os_family == 'Debian'
