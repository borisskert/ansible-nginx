provisioner:
  name: ansible
  playbooks:
    converge: ../shared/converge.yml
  inventory:
    group_vars:
      docker:
        molecule_docker_environment: true
      debian:
        ansible_python_interpreter: /usr/bin/python3
    host_vars:
      ansible-nginx-noble:
        nginx_ca_name: ansible-nginx-noble
      ansible-nginx-jammy:
        nginx_ca_name: ansible-nginx-jammy
      ansible-nginx-focal:
        nginx_ca_name: ansible-nginx-focal
      ansible-nginx-bookworm:
        nginx_ca_name: ansible-nginx-bookworm
      ansible-nginx-bullseye:
        nginx_ca_name: ansible-nginx-bullseye

verifier:
  name: ansible
